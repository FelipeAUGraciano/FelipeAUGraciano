# Gera a animação da Byte "caçando" o seu gráfico de contribuições.
# Roda todo dia e também pode ser disparado manualmente na aba Actions.
name: Byte caçando commits

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/byte-hunt.svg?palette=github-light&color_snake=#3a86ff
            dist/byte-hunt-dark.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#0d1626,#163066,#2f5fb3,#3a86ff,#7fb8ff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
